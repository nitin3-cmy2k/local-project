apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: docker.io/mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "rootpassword" # In production, use Kubernetes Secrets
        - name: MYSQL_DATABASE
          value: "mydb"
        ports:
        - containerPort: 3306
      imagePullSecrets:
      - name: dockerhub-cred
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  ports:
  - port: 3306
  selector:
    app: mysql

