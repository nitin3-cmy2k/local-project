apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: docker.io/nitin3cmy2k/devops/frontend:latest # Jenkins will push to this
        ports:
        - containerPort: 80
      imagePullSecrets:
      - name: dockerhub-cred
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080 # Accessible via http://<K8s-VM-IP>:30080
  selector:
    app: frontend

